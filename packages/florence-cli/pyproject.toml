[project]
name = "florence-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["florence-core", "florence-edena"]
[project.scripts]
florence = "florence_cli.main:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["florence_cli"]
