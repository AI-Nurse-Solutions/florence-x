name: docs
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Always build with --strict so broken links/nav fail the PR. This is the gate.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install mkdocs-material
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  # Deploy to GitHub Pages — dormant until you opt in by setting the repo
  # variable ENABLE_PAGES=true (Settings → Secrets and variables → Actions →
  # Variables) and enabling Pages (Settings → Pages → Source: GitHub Actions).
  # Private-repo Pages requires a GitHub Pro/Team/Enterprise plan.
  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
