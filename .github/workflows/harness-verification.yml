name: harness-verification
on:
  pull_request:
permissions:
  contents: read
jobs:
  full-suite:
    if: github.head_ref == 'review/harness-initiation-2026-09-08'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: florence_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: florence_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd 'redis-cli ping'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLORENCE_TEST_DATABASE_URL: postgresql+psycopg://florence_test:ephemeral_ci_only@localhost:5432/florence_test
      FLORENCE_TEST_REDIS_URL: redis://localhost:6379/15
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: open-policy-agent/setup-opa@v2
      - name: Install repository dependencies
        id: install
        run: |
          pip install -e packages/florence-core -e packages/florence-edena -e packages/florence-connectors -e packages/florence-model-router -e packages/florence-cli
          pip install '.[api,dev]' 'ruff==0.16.6'
          mkdir -p /tmp/harness-evidence
          pip freeze > /tmp/harness-evidence/dependencies.txt
      - name: Full unmodified test collection
        id: tests
        run: |
          set -o pipefail
          pytest -q -ra --junitxml=/tmp/harness-evidence/tests.xml 2>&1 | tee /tmp/harness-evidence/tests.txt
      - name: Schema drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          from florence_core.schemas import CandidateAction, EDENADecision
          for name, model in [('candidate_action', CandidateAction), ('edena_decision', EDENADecision)]:
              assert json.load(open(f'schemas/{name}.schema.json')) == model.model_json_schema(), f'drift: {name}'
          print('no schema drift')
          PY
      - name: Lint repair proposal in disposable worktree
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python - <<'PY'
          import pathlib, subprocess, tempfile
          root = pathlib.Path.cwd()
          evidence = pathlib.Path('/tmp/harness-evidence')
          baseline = subprocess.run(['ruff', 'check', '.', '--output-format=concise'], text=True, capture_output=True, check=False)
          (evidence / 'lint-before.txt').write_text(baseline.stdout + baseline.stderr)
          print('BASELINE LINT\n' + baseline.stdout)
          with tempfile.TemporaryDirectory() as td:
              subprocess.run(['git', 'worktree', 'add', '--detach', td, 'HEAD'], check=True, capture_output=True)
              try:
                  fixed = subprocess.run(['ruff', 'check', '--fix', '.', '--output-format=concise'], cwd=td, text=True, capture_output=True, check=False)
                  print('REMAINING AFTER SAFE FIXES\n' + fixed.stdout)
                  patch = subprocess.run(['git', 'diff', '--no-ext-diff', '--unified=2'], cwd=td, text=True, capture_output=True, check=True).stdout
                  (evidence / 'safe-fixes.patch').write_text(patch)
                  print('PROPOSED SAFE PATCH\n' + patch)
              finally:
                  subprocess.run(['git', 'worktree', 'remove', '--force', td], check=True)
          raise SystemExit(baseline.returncode)
          PY
      - name: Preserve evidence even on failure
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: harness-verification-evidence
          path: /tmp/harness-evidence
          retention-days: 14
