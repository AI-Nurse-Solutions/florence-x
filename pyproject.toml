[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "florence-x"
version = "0.1.0"
description = "Governance-first, local-first AI orchestration control plane for high-trust clinical environments."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Florence-X / NAIO Institute" }]

dependencies = [
  "pydantic>=2,<3",
  "pyyaml>=6",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2", "psycopg[binary]>=3", "redis>=5", "alembic>=1.13", "opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-http>=1.20", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=2", "langgraph-checkpoint-postgres>=2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "opentelemetry-sdk>=1.20", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=2"]

[project.scripts]
florence = "florence_cli.main:main"

# Local packages are developed as a path-based workspace. For editable installs:
#   pip install -e packages/florence-core -e packages/florence-edena \
#               -e packages/florence-connectors -e packages/florence-model-router \
#               -e packages/florence-cli
# The root project ships no importable packages of its own — the code lives in
# packages/* (installed separately). Tell setuptools so it doesn't try to
# auto-discover apps/, packages/, schemas/, … as a flat layout.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = [
  "packages/florence-core",
  "packages/florence-edena",
  "packages/florence-connectors",
  "packages/florence-model-router",
  "packages/florence-cli",
  "apps/api",
]
testpaths = ["tests"]
